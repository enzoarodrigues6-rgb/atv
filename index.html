<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/style.css">
    </link>
    <title>Document</title>
</head>

<body>
    <div class="container">
        <h1>Cadastro Do Cinemark</h1>

        <form>
            <div class="form-control">

                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome">
            </div>

             <div class="from-control">
                <label for="gênero">Gênero:</label>
                <select id="gênero">
                    <option value="">Selecione</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                </select>
            </div>

             <div class="from-control">
                <label for="apelido">Como Gosta De Ser Chamado:</label>
                <input type="text" id="apelido">
            </div>

            <div class="form-control">
                <label for="data">Data de nascimento</label>
                <input type="date" id="data">
            </div>

             <div class="from-control">
                <label for="CPF">CPF:</label>
                <input type="text" id="CPF">
            </div>

             <div class="from-control">
                <label for="Usar_CPF">Use O Mesmo CPF Para Notas Fiscais E Recibos:</label>
                <select id="Usar_CPF">
                    <option value="">Selecione</option>
                    <option value="sim">sim </option>
                    <option value="não">não</option>
                </select>
            </div>

            <div class="from-control">
                <label for="email">Email:</label>
                <input type="email" id="email" />
            </div>

             <div class="from-control">
                <label for="endereço">Endereço:</label>
                <input type="text" id="endereço">
            </div>

            
                  
            <div class="from-control">
                <label for="senha">Senha</label>
                <input type="password" id="senha">
            </div>
           
        <div class="form-control">
            <button type="submit" class="btn-cadastro">Cadastrar</button>
            <button type="reset" class="btn-limpar">Limpar</button>
        </div>
              

        </form>

    </div>

</body>

</html>
